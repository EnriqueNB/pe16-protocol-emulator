# Tiny Tapeout project information
project:
  title:        "PE-16 Protocol Emulator ASIC (template scaffold)" # Project title
  author:       "EnriqueNB"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Reprogrammable, timing-exact coprocessor for pin-level protocols (UART, SPI, I2C); this stub still runs the unmodified TT template example." # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "A[0] (stub adder operand)"
  ui[1]: "A[1] (stub adder operand)"
  ui[2]: "A[2] (stub adder operand)"
  ui[3]: "A[3] (stub adder operand)"
  ui[4]: "A[4] (stub adder operand)"
  ui[5]: "A[5] (stub adder operand)"
  ui[6]: "A[6] (stub adder operand)"
  ui[7]: "A[7] (stub adder operand)"

  # Outputs
  uo[0]: "SUM[0] = A[0]+B[0]"
  uo[1]: "SUM[1] = A[1]+B[1]"
  uo[2]: "SUM[2] = A[2]+B[2]"
  uo[3]: "SUM[3] = A[3]+B[3]"
  uo[4]: "SUM[4] = A[4]+B[4]"
  uo[5]: "SUM[5] = A[5]+B[5]"
  uo[6]: "SUM[6] = A[6]+B[6]"
  uo[7]: "SUM[7] = A[7]+B[7]"

  # Bidirectional pins
  uio[0]: "B[0] (stub adder operand, input only)"
  uio[1]: "B[1] (stub adder operand, input only)"
  uio[2]: "B[2] (stub adder operand, input only)"
  uio[3]: "B[3] (stub adder operand, input only)"
  uio[4]: "B[4] (stub adder operand, input only)"
  uio[5]: "B[5] (stub adder operand, input only)"
  uio[6]: "B[6] (stub adder operand, input only)"
  uio[7]: "B[7] (stub adder operand, input only)"

