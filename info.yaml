# Tiny Tapeout project information
project:
  title:        "PE-16 Protocol Emulator"
  author:       "EnriqueNB"
  discord:      ""
  description:  "Reprogrammable, timing-exact coprocessor that runs pin-level protocols (UART, SPI, I2C) as loadable programs. Phase 0 scaffold: a UART transmitter carrying the flow at full 6x4 area."
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_enb7395_pe16"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_pe16.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "TXDATA[0]"
  ui[1]: "TXDATA[1]"
  ui[2]: "TXDATA[2]"
  ui[3]: "TXDATA[3]"
  ui[4]: "TXDATA[4]"
  ui[5]: "TXDATA[5]"
  ui[6]: "TXDATA[6]"
  ui[7]: "TXDATA[7]"

  # Outputs
  uo[0]: "TX (UART serial out, 115200 8N1 @ 50 MHz)"
  uo[1]: "BUSY (frame in flight)"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "START (rising edge latches TXDATA and sends)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
